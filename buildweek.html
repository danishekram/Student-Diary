<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Build Week - Student Diary</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-512.png">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #071521; color: #ffffff; padding: 24px 16px; min-height: 100vh; }
    
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    h1 { font-size: 28px; font-weight: 700; }
    .badge { background: transparent; border: 1px solid #14746f; color: #53ddcd; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; letter-spacing: 1px; }

    .status-text { font-size: 16px; color: #cfd8dc; margin-bottom: 8px; }
    .instruction-text { font-size: 14px; color: #90a4ae; margin-bottom: 14px; }

    .days-container { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .day-btn { background: #132a3a; color: #ffffff; border: 1px solid #204b66; padding: 10px 16px; border-radius: 10px; font-weight: 600; cursor: pointer; }
    .day-btn.active { background: #53ddcd; color: #071521; border-color: #53ddcd; }
    .day-btn.completed { border-color: #53ddcd; color: #53ddcd; }

    .card { background: #0c2333; border: 1px solid #1a3f5c; border-radius: 14px; padding: 18px; margin-bottom: 20px; }
    .input-row { display: flex; gap: 10px; margin-bottom: 14px; }
    input[type="number"], input[type="text"] { flex: 1; background: #071521; border: 1px solid #204b66; color: #fff; padding: 12px; border-radius: 8px; font-size: 15px; outline: none; }
    
    .btn-add { background: #14746f; color: #ffffff; border: none; padding: 0 16px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    
    .subject-list { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
    .subject-item { display: flex; align-items: center; gap: 10px; background: #132a3a; padding: 6px 10px; border-radius: 8px; }
    .subject-number { font-size: 14px; font-weight: 700; color: #53ddcd; width: 22px; }
    .btn-remove { background: #e53935; color: #fff; border: none; padding: 8px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }

    .btn-save-day { width: 100%; background: #53ddcd; color: #071521; border: none; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: 700; margin-top: 16px; cursor: pointer; }
    .btn-submit-week { width: 100%; background: #1a3f5c; color: #546e7a; border: none; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: not-allowed; }
    .btn-submit-week.ready { background: #53ddcd; color: #071521; cursor: pointer; }
  </style>
</head>
<body>

  <div class="header">
    <h1>Build Week</h1>
    <span class="badge">TIMETABLE</span>
  </div>

  <p class="status-text" id="status-counter">0 of 5 days added</p>
  <p class="instruction-text">1 Pick a day to fill in</p>

  <div class="days-container" id="days-wrapper"></div>

  <!-- Day Configuration Section -->
  <div class="card" id="day-config-card">
    <h3 id="selected-day-title" style="margin-bottom: 12px; color: #53ddcd;">Monday</h3>
    
    <label style="font-size: 13px; color: #90a4ae;">Total number of subjects:</label>
    <div class="input-row" style="margin-top: 6px;">
      <input type="number" id="subject-count-input" min="1" max="12" placeholder="e.g. 5">
      <button class="btn-add" onclick="setSubjectCount()">Set Count</button>
    </div>

    <div class="subject-list" id="subject-list-container"></div>

    <button class="btn-save-day" onclick="saveCurrentDay()">Save Day</button>
  </div>

  <button class="btn-submit-week" id="btn-submit" onclick="submitWeeklySchedule()">Submit weekly schedule →</button>

  <script>
    // 1. Detect education level (Removes Saturday for UG/PG)
    const userEducation = (localStorage.getItem('education_level') || 'UG').toUpperCase();
    const isUGorPG = userEducation.includes('UG') || userEducation.includes('PG') || userEducation === 'BTECH' || userEducation === 'MTECH';
    
    const availableDays = isUGorPG 
      ? ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'] 
      : ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

    let currentDay = availableDays[0];
    let schedule = JSON.parse(localStorage.getItem('weekly_schedule') || '{}');
    let currentSubjects = [];

    // Render day selector buttons
    function renderDays() {
      const wrapper = document.getElementById('days-wrapper');
      wrapper.innerHTML = '';
      let completedCount = 0;

      availableDays.forEach(day => {
        const btn = document.createElement('button');
        btn.className = `day-btn ${day === currentDay ? 'active' : ''} ${schedule[day] ? 'completed' : ''}`;
        btn.innerText = day;
        btn.onclick = () => selectDay(day);
        wrapper.appendChild(btn);
        if (schedule[day]) completedCount++;
      });

      document.getElementById('status-counter').innerText = `${completedCount} of ${availableDays.length} days added`;
      
      const submitBtn = document.getElementById('btn-submit');
      if (completedCount === availableDays.length) {
        submitBtn.classList.add('ready');
        submitBtn.style.cursor = 'pointer';
      } else {
        submitBtn.classList.remove('ready');
        submitBtn.style.cursor = 'not-allowed';
      }
    }

    function selectDay(day) {
      currentDay = day;
      document.getElementById('selected-day-title').innerText = day;
      currentSubjects = schedule[day] ? [...schedule[day]] : [];
      document.getElementById('subject-count-input').value = currentSubjects.length || '';
      renderSubjects();
      renderDays();
    }

    // Set count while keeping existing subject names
    function setSubjectCount() {
      const count = parseInt(document.getElementById('subject-count-input').value) || 0;
      
      // Preserve typed inputs first
      syncInputsToArray();

      if (count > currentSubjects.length) {
        while (currentSubjects.length < count) {
          currentSubjects.push('');
        }
      } else if (count < currentSubjects.length) {
        currentSubjects = currentSubjects.slice(0, count);
      }
      renderSubjects();
    }

    function syncInputsToArray() {
      const inputs = document.querySelectorAll('.subject-name-input');
      inputs.forEach((input, index) => {
        if (currentSubjects[index] !== undefined) {
          currentSubjects[index] = input.value;
        }
      });
    }

    // Render dynamic subject fields with remove button
    function renderSubjects() {
      const container = document.getElementById('subject-list-container');
      container.innerHTML = '';

      currentSubjects.forEach((subj, idx) => {
        const row = document.createElement('div');
        row.className = 'subject-item';

        row.innerHTML = `
          <span class="subject-number">${idx + 1}</span>
          <input type="text" class="subject-name-input" value="${subj}" placeholder="Subject ${idx + 1} name" oninput="currentSubjects[${idx}] = this.value">
          <button type="button" class="btn-remove" onclick="removeSubject(${idx})">✕</button>
        `;
        container.appendChild(row);
      });

      // Automatically update the number box count
      document.getElementById('subject-count-input').value = currentSubjects.length;
    }

    // Remove single subject item without wiping others
    function removeSubject(index) {
      syncInputsToArray();
      currentSubjects.splice(index, 1);
      renderSubjects();
    }

    function saveCurrentDay() {
      syncInputsToArray();
      const validSubjects = currentSubjects.filter(s => s.trim() !== '');
      
      if (validSubjects.length === 0) {
        alert('Please add at least one subject before saving this day.');
        return;
      }

      schedule[currentDay] = validSubjects;
      localStorage.setItem('weekly_schedule', JSON.stringify(schedule));
      renderDays();
      alert(`${currentDay} schedule saved!`);
    }

    function submitWeeklySchedule() {
      const completedCount = Object.keys(schedule).filter(k => availableDays.includes(k)).length;
      if (completedCount < availableDays.length) {
        alert(`Please complete all ${availableDays.length} days before submitting.`);
        return;
      }
      window.location.href = '/attendance.html';
    }

    // Initialize on page load
    selectDay(availableDays[0]);
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js');
      });
    }
  </script>
</body>
</html>
